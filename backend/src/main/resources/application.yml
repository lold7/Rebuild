spring:
  application:
    name: low-cortisol-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    # An address-branch database may already have V6 before the cart branch's V5 is merged.
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
app:
  catalog:
    demo-enabled: ${CATALOG_DEMO_ENABLED:false}
    image-directory: ${PRODUCT_IMAGE_DIRECTORY:./uploads/product-images}
  password-reset:
    delivery: ${PASSWORD_RESET_DELIVERY:disabled}
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:http://localhost:8080/api/auth/reset-password}
    from: ${SMTP_FROM:noreply@bookstore.local}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    remember-me-key: ${REMEMBER_ME_KEY}
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
