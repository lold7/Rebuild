spring:
  application:
    name: low-cortisol-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    remember-me-key: ${REMEMBER_ME_KEY}
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
