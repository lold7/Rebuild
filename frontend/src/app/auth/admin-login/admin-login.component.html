<div class="admin-login-wrapper d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
  <div class="login-card mx-3 mx-sm-0">
    <div class="login-card-body p-4 p-sm-5">
      <div class="login-icon-box mx-auto mb-3">
        <mat-icon>menu_book</mat-icon>
      </div>
      <h3 class="text-center fw-bold mb-2">Bookstore Admin</h3>
      <p class="text-center text-muted mb-4 font-size-14">Welcome back! Please sign in to continue.</p>

      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-bold font-size-12 text-dark mb-2">Email Address</label>
          <div class="position-relative">
            <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">email</mat-icon>
            <input type="email" formControlName="email" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="admin@bookstore.com" required>
          </div>
        </div>
        <div class="mb-3 mt-4">
          <label class="form-label fw-bold font-size-12 text-dark mb-2">Password</label>
          <div class="position-relative">
            <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">lock</mat-icon>
            <input type="password" formControlName="password" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="Enter your password" required>
          </div>
        </div>

        <div class="d-flex justify-content-end mb-4">
          <a routerLink="/auth/login" class="text-primary text-decoration-none font-size-12 fw-medium">Back to customer login</a>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
          {{ isLoading ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>
    </div>
    <div class="login-card-footer text-center p-3 border-top bg-light rounded-bottom-4">
      <p class="m-0 text-muted font-size-14 d-inline">Don't have an account? </p>
      <a routerLink="/contact" class="text-primary text-decoration-none fw-medium font-size-14">Contact Support</a>
    </div>
  </div>

  <div class="mt-4 text-center">
    <p class="text-muted mb-0" style="font-size: 0.72rem;">&copy; 2026 Bookstore Inc. All rights reserved.</p>
  </div>
</div>
