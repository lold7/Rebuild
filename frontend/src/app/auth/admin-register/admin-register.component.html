<div class="admin-login-wrapper d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
  <div class="login-card mx-3 mx-sm-0" style="max-width: 480px;">
    <div class="login-card-body p-4 p-sm-5">
      <div class="login-icon-box mx-auto mb-3">
        <mat-icon>person_add</mat-icon>
      </div>
      <h3 class="text-center fw-bold mb-2">Create New Admin</h3>
      <p class="text-center text-muted mb-4 font-size-14">Set up a new administrative account.</p>

      @if (errorMessage) {
        <div class="alert alert-danger py-2 font-size-14">{{ errorMessage }}</div>
      }
      @if (successMessage) {
        <div class="alert alert-success py-2 font-size-14">{{ successMessage }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-bold font-size-12 text-dark mb-2">Username</label>
          <div class="position-relative">
            <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">person</mat-icon>
            <input type="text" formControlName="username" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="AdminUsername">
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-sm-6">
            <label class="form-label fw-bold font-size-12 text-dark mb-2">Email Address</label>
            <div class="position-relative">
              <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">email</mat-icon>
              <input type="email" formControlName="email" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="admin@bookstore.com">
            </div>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-bold font-size-12 text-dark mb-2">Phone (Optional)</label>
            <div class="position-relative">
              <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">call</mat-icon>
              <input type="tel" formControlName="phone" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="Phone Number">
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold font-size-12 text-dark mb-2">Password</label>
          <div class="position-relative">
            <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">lock</mat-icon>
            <input type="password" formControlName="password" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="At least 8 characters">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold font-size-12 text-dark mb-2">Confirm Password</label>
          <div class="position-relative">
            <mat-icon class="login-input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">check_circle</mat-icon>
            <input type="password" formControlName="confirmPassword" class="form-control login-form-control py-2 ps-5 text-dark border-light-subtle shadow-sm" placeholder="Repeat the password">
          </div>
        </div>
        <button type="submit" [disabled]="isLoading" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
          {{ isLoading ? 'Creating...' : 'Register Admin' }}
        </button>
      </form>
    </div>
    <div class="login-card-footer text-center p-3 border-top bg-light rounded-bottom-4">
      <a routerLink="/backoffice" class="text-primary text-decoration-none fw-medium font-size-14">&larr; Back to Dashboard</a>
    </div>
  </div>

  <div class="mt-4 text-center">
    <p class="text-muted mb-0" style="font-size: 0.72rem;">&copy; 2026 Bookstore Inc. All rights reserved.</p>
  </div>
</div>
